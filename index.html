<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAROCAINTY SPA | Marketplace Authentique</title>
    <style>
        /* Base Design Index 2 */
        :root { --m-red: #E63946; --a-orange: #F4A261; --c-green: #2A9D8F; --bg: #fdfdfd; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); }
        .navbar { display: flex; justify-content: space-between; padding: 20px 5%; align-items: center; border-bottom: 1px solid #eee; }
        .logo-text span { font-weight: 800; font-size: 24px; }
        
        /* Hidden Sections (SPA Logic from Index 3) */
        .page-view { display: none; padding: 50px 5%; }
        .page-view.active { display: block; }
        
        /* Grid System */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { border: 1px solid #eee; border-radius: 8px; padding: 20px; transition: 0.3s; }
        .card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo-text" onclick="router.navigate('home')">
            <span style="color:var(--m-red)">M</span><span style="color:var(--a-orange)">A</span>ROC<span style="color:var(--c-green)">AINTY</span>
        </div>
        <div>
            <button onclick="router.navigate('partner')">Startup Partner</button>
            <button onclick="cart.toggle()">Panier (<span id="count">0</span>)</button>
        </div>
    </nav>

    <div id="home" class="page-view active">
        <h1>Bienvenue chez Marocainty</h1>
        <div class="grid" id="cat-grid">
            <div class="card" onclick="router.navigate('brands', 'nourriture')">Nourriture</div>
            <div class="card" onclick="router.navigate('brands', 'vetements')">Vêtements</div>
        </div>
    </div>

    <div id="brands" class="page-view">
        <h1 id="brand-title">Nos Marques</h1>
        <div class="grid" id="brand-list"></div>
    </div>

    <div id="checkout" class="page-view">
        <h1>Finaliser la commande</h1>
        <form onsubmit="app.submitOrder(event)">
            <input type="text" placeholder="Nom" required><br>
            <button type="submit">Payer</button>
        </form>
    </div>

    <script>
        const router = {
            navigate(id, filter = null) {
                document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(id === 'brands') app.renderBrands(filter);
            }
        };
        const app = {
            renderBrands(cat) {
                const list = [{id:1, name:'Brand X', cat:'nourriture'}];
                document.getElementById('brand-list').innerHTML = list
                    .filter(b => b.cat === cat)
                    .map(b => `<div class="card"><h3>${b.name}</h3><button onclick="cart.add('${b.name}')">Acheter</button></div>`).join('');
            },
            submitOrder(e) {
                e.preventDefault();
                alert("Commande réussie !");
                router.navigate('home');
            }
        };
        const cart = {
            items: [],
            add(name) { this.items.push(name); document.getElementById('count').innerText = this.items.length; },
            toggle() { alert("Panier: " + this.items.join(', ')); }
        };
    </script>
</body>
</html>
